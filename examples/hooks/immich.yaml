# Hotify 插件：Immich 新照片入库通知（手机备份/网页上传/CLI 导入新资产 → 手机推送）。
# ⚠️ 版件要求：Immich v3.0.0+（2026-07-02 发布）。webhook 走的是 v3 新增的 workflow 子系统：
#   v2.7.5（2026-04）整目录 packages/plugin-core 不存在（404 实测）；v3.0.0 与 v3.1.0（当前最新，
#   2026-07-29）均含内置 "Trigger Webhook" 动作（packages/plugin-core/manifest.json，grep=1 实测两 tag）。
#   官方文档站 docs.immich.app **尚无 workflow/webhook 页面**（仓库 docs/docs/ 全列表无对应 mdx，
#   2026-08-28 核对）——文档落后于代码，行为以源码为准（memos/Grafana 同款形态，hooks.md §5）。
# 行为基线 = 源码查证（github.com/immich-app/immich，main@2026-08-28 + tag v3.1.0 抽查一致）：
#   - 发送侧：packages/plugin-core/src/index.ts `webhook` 动作——body 恒为
#     {"type":…, "trigger":…, "data":…} 三键 JSON（JSON.stringify；config/workflow 不外发），
#     Content-Type: application/json；可选**恰好一个**自定义 header（headerName 与 headerValue
#     成对才发，manifest.json schema）；method 缺省 POST（可 PUT——Hotify 门只认 POST，别选）；
#     **无任何签名机制**（hmac/SW 均无）。httpRequest 为 fire-and-forget：响应被丢弃、无重试。
#   - 事件全集：server/src/utils/workflow.ts triggerMap——AssetCreate / AssetMetadataExtraction /
#     AssetTagged 三个（PersonRecognized/AssetPersonV1 注释未启用）。**无相册（album）触发器**，
#     "相册有新照片"以"照片入库"（AssetCreate）近似。每资产每触发一发（workflow-execution.service.ts
#     @OnEvent('AssetCreate') → 按 ownerId 反查该用户 workflow → 队列逐资产执行）。
#   - payload.data.asset 字段集：server/src/repositories/workflow.repository.ts getForAssetV1
#     （workflowAssetV1 列 + tags 数组 + exifInfo 对象|null，见 server/src/database.ts 列清单）。
#
# ── 部署（共 5 步，两侧）────────────────────────────────────────────────
# 1. Hotify 侧：本文件放入工作目录 hooks/ 下（Docker 部署 = /data/hooks，compose 挂载
#    ./hooks:/data/hooks；挂错路径 = 静默零插件，hooks.md §1）。
# 2. Hotify 侧：设环境变量 HOOKS_IMMICH_SECRET=<自选随机串>（compose environment: 块——GUI
#    部署不吃 .env，hooks.md §3.5），重启 server，启动自检绿 = 装好。
#    探针：curl -X POST https://<你的-hotify-host>/hooks/immich → 401 = 已加载；404 = 没加载。
# 3. Immich web → 左栏 "Workflows" → "Create workflow"（新建默认**禁用**、trigger 默认即
#    "Asset Upload" 正是本插件要的，不用改）→ 在详情页给 workflow 起个可认的名字（如 Hotify 通知）。
#    （workflow 按用户归属，只对创建者自己上传的资产生效；管理员/普通用户均可建。）
# 4. 同一详情页 → "Add step" → 选 "Trigger Webhook"（描述 "POST/PUT event data to any URL"）→
#    照抄填四项：
#        URL:          https://<你的-hotify-host>/hooks/immich
#        Header name:  X-Hotify-Token
#        Header value: <与第 2 步 HOOKS_IMMICH_SECRET 完全相同的串，原样，不加 Bearer 前缀>
#        Method:       留空或 POST（选 PUT 则 Hotify 门不认，永不通知）
#    （这四项是本插件 wire 契约的一部分：header 成对才随请求发出——static-token 验证的载体。）
# 5. 详情页右上 "Enable" 启用 → 手机传一张新照片（或网页上传）→ 手机收到推送 = 端到端通。
#
# ⚠️ 已知边界（hooks/v1 表达力天花板 §8/§9 + 源端行为）：
#   - **通知风暴**：AssetCreate 每照片一发、无聚合。首次全量备份几千张 = 几千条推送——
#     务必先传完存量再 Enable，或接受风暴；想聚合成「一批 N 张」须写 Go 皮（hooks.md §8）。
#   - exifInfo 引用禁区：AssetCreate 时刻 exif 提取作业可能未跑（exifInfo=null）也可能已完成
#     （异步竞态），且它本身是对象（§4.1）——mapping 一律不碰 $.data.asset.exifInfo.*。
#     checksum 同理：Buffer 的 JSON 形态是 {"type":"Buffer","data":[…]} 对象，不可引用。
#   - tags 是对象数组（TagResponseDto[]，新照片为 []）——不可引用（§4.1）。
#   - fire-and-forget：Immich 侧不读响应、不重试（v3.1.0 index.ts 丢弃 httpRequest 返回值）——
#     Hotify 恰好宕机的瞬间该条通知即丢（workflow 日志亦不留痕），通知场景可接受。
#   - 无签名机制 → verify 走 static-token 自定义 header（§3.4「源端可塞 header 永远更优」；
#     header 名避开 Authorization 防反代剥改）。任何人知道 URL 但不知道 secret 值 = 推不进来。
#   - 单事件单文案：IMAGE/VIDEO 不能分别定制标题（单 filter 单 mapping，§9）——用 body 里的
#     type 字段（IMAGE/VIDEO/AUDIO/OTHER，enum.ts）一并呈现。

id: immich                     # URL 段 POST /hooks/immich；secret 变量名 HOOKS_IMMICH_SECRET 由它推导（§3.5）
apiVersion: hooks/v1

# 验签：Immich webhook 动作零签名，但可配一个自定义 header（manifest schema 的 headerName/
# headerValue，实现里成对才发）→ static-token（§3.3）。header 值与 HOOKS_IMMICH_SECRET 做
# 常数时间全等比较：Immich 侧 "Header value" 填什么，环境变量就一字不差是什么。
verify:
  type: static-token
  header: X-Hotify-Token

# 事件筛选：判别字段 trigger 在 JSON body 里（比 GitHub 的 X-GitHub-Event 体面，filter 可用，
# hooks.md §10.1b 的正路）。只推 AssetCreate（照片入库）；AssetMetadataExtraction（每资产
# 元数据提取完再发一次，若部署者另建了那种 workflow 会撞同一 URL）与 AssetTagged（打标签）
# 一律拒——建两个 workflow 指向同一个 Hotify 门时，靠这道 filter 保证只收到入库信号。
# $.type 恒为 "AssetV1"（当前唯一生效事件类型，enum.ts），无区分度，不进 filter。
filter:
  equals:
    $.trigger: AssetCreate

# 通知内容：两个引用都是 asset 表 NOT NULL 列（type 枚举列 / originalFileName 文本列），
# getForAssetV1 无条件 select，不存在缺字段形态，零提取失败面。
#   title 固定「新照片入库」——AssetCreate 语义即入库（含网页上传/CLI 导入，不只手机备份）。
#   url 深链默认注释掉：AssetV1 payload **不含 Immich 自身域名**（无 externalUrl 类字段），
#   模板无法从 body 拼出跳转链接；要的话取消下行注释并把前缀换成你的 Immich 地址——
#   url 是装饰字段（§4.3），id 提取失败时省略照发，不会连累通知。
mapping:
  title: "[Immich] 新照片入库"
  body: "{{$.data.asset.type}} · {{$.data.asset.originalFileName}}"
  # url: "https://<你的-immich-地址>/photos/{{$.data.asset.id}}"   # 深链路由 = /photos/{id}（web/src/lib/route.ts viewAsset）

# 投递目标："" = 广播全部设备（hooks.md §10 默认）；要单台改成自己的 slug 或 uuid。禁止 key1。
device: ""

# 样例（§5 捕获型源——wire 由 plugin-core 源码钉死；降级档：形状逐字段钉自 getForAssetV1 列清单
# 与 AssetV1 类型（plugin-sdk/src/types.ts），值按列类型构造（uuid/ISO/枚举字面量），未实机捕获。
# checksum（Buffer→对象）/duration（interval 串）等未引用字段的具体 wire 形态未逐字钉死，
# 不列入（memos 样板先例：列入只添编造风险）；asset.id 取值按 uuid 格式构造。
# 时间戳为 Kysely Date→ISO 串形态；AssetCreate 时 exif 常未提取（异步竞态），null 形态合法。）
examples:
  - name: photo-uploaded
    body:
      type: AssetV1                              # WorkflowType 唯一生效成员（server/src/enum.ts）
      trigger: AssetCreate                       # 判别字段（WorkflowTrigger 枚举字符串）
      data:
        asset:
          id: e7637b4e-64e7-4a44-8e44-6f1e7a2d3f01
          ownerId: 652d9c7f-1b3a-4f8e-9c2d-7a6e5b4c3d21   # 上传者（workflow 按它归属用户）
          stackId: null                          # 未入栈
          livePhotoVideoId: null                 # 非 LivePhoto
          libraryId: null                        # 手机/网页上传不入外部库
          duplicateId: null                      # 非重复资产（重复上传被 dedupe 拒，不产 AssetCreate）
          createdAt: "2026-08-27T19:03:20.114Z"
          updatedAt: "2026-08-27T19:03:20.114Z"
          deletedAt: null
          fileCreatedAt: "2026-08-27T11:03:12.000Z"       # 相机拍摄时刻（EXIF 之前=文件名推测）
          fileModifiedAt: "2026-08-27T11:03:12.000Z"
          localDateTime: "2026-08-27T11:03:12.000Z"
          type: IMAGE                            # AssetTypeEnum：IMAGE|VIDEO|AUDIO|OTHER
          status: active                         # AssetStatusEnum：active|trashed|deleted
          visibility: timeline                   # AssetVisibilityEnum：timeline|archive|hidden|locked
          originalPath: upload/652d9c7f-1b3a-4f8e-9c2d-7a6e5b4c3d21/2026/2026-08-27/IMG_20260827_193412.jpg
          originalFileName: IMG_20260827_193412.jpg
          isOffline: false
          isFavorite: false
          isExternal: false
          isEdited: false
          tags: []                               # jsonArrayFrom：新照片无标签=空数组（非 null）
          exifInfo: null                         # AssetCreate 时提取作业未跑完的常见形态
    expect:
      pass: true
      title: "[Immich] 新照片入库"
      body: "IMAGE · IMG_20260827_193412.jpg"
  # 负样本 1（filter miss）：部署者若另建 AssetMetadataExtraction 触发的 workflow 指向同一 URL，
  # 每资产会在提取完成后再撞一次门——filter 拒之，避免同一照片双通知。
  # filter miss 即止、mapping 不执行，样本只留判别相关字段。
  - name: metadata-extracted-ignored
    body:
      type: AssetV1
      trigger: AssetMetadataExtraction          # 真实枚举值（utils/workflow.ts triggerMap）
      data:
        asset:
          id: e7637b4e-64e7-4a44-8e44-6f1e7a2d3f01
          originalFileName: IMG_20260827_193412.jpg
    expect:
      pass: false
  # 负样本 2（filter miss）：AssetTagged（打标签触发）同样拒。
  - name: asset-tagged-ignored
    body:
      type: AssetV1
      trigger: AssetTagged                      # 真实枚举值（utils/workflow.ts triggerMap）
      data:
        asset:
          id: e7637b4e-64e7-4a44-8e44-6f1e7a2d3f01
          originalFileName: IMG_20260827_193412.jpg
    expect:
      pass: false
