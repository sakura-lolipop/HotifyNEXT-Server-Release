# Hotify 插件：Grafana 告警通知（alerting webhook contact point → 手机推送）。
# 行为基线 = Grafana 官方文档 webhook-notifier 页（grafana.com/docs/grafana/latest/alerting/
#   configure-notifications/manage-contact-points/integrations/webhook-notifier/，2026-08 抓取）
#   + 发送侧源码 github.com/grafana/alerting（Grafana 12/13 的 notifier 引擎模块）：
#   receivers/webhook/v1/webhook.go（payload 组装）、receivers/webhook/v1/config.go（全部配置项）、
#   http/hmac.go（签名实现）、templates/default_template.go（title/message 默认模板）、
#   templates/template_data.go（ExtendedData/ExtendedAlert JSON 形状）。
# ⚠️ 文档示例 payload 的 message 块相对当前代码已陈旧：无 "Value:" 行、alertname=T2/T1 与其
#   自身 labels 不符。examples 的 title/message 以模板源码推导为准（memos 同款教训：文档落后于代码）。
#
# ── Grafana 侧配置（部署指令）──────────────────────────────────────────
# Alerts & IRM → Alerting → Contact points → + Add contact point → Integration: Webhook
#   URL:  http://<你的-hotify-server>:<port>/hooks/grafana
#   HMAC Signature:
#     Secret:           自定义随机串（与 HOOKS_GRAFANA_SECRET 完全一致，原样字符串）
#     Header:           留空（默认即 X-Grafana-Alerting-Signature）
#     Timestamp Header: ⚠️ 必须留空。一旦设置，Grafana 改签 "timestamp:body"
#                        （hmac.go：hash.Write(timestamp); hash.Write(":")），
#                        而 hooks/v1 hmac 族只验裸 body（hooks.md §9 明列 ts:body 型不支持）→ 永久 401。
#   其余默认即可（HTTP Method=POST）。"Disable resolved message" 默认关：恢复通知也会推，
#   title 里带 [RESOLVED] 可辨；想只收触发就开它，或用下面注释掉的 filter。
#
# ── Hotify 侧安装 ─────────────────────────────────────────────────────
# 复制到工作目录 hooks/（docker：compose 挂 ./hooks:/data/hooks——挂错路径=静默零插件）
# + 设 HOOKS_GRAFANA_SECRET=<Grafana 侧同一串>（compose environment: 块，GUI 不吃 .env）
# + 重启 server。
#
# ── 排障 ───────────────────────────────────────────────────────────────
# · 判据行：`[hooks] grafana delivered`（stdout，docker logs 可见；启动另有
#   `[hooks] loaded N plugin(s): …` 确认行，N=0=目录没被看到）
# · 日志位置：本机=工作目录 hotify.log；docker=/data/hotify.log（filter miss/401 只在文件道）
# · 探针 404 双形态：POST /hooks/grafana → 404 body=unknown hook=插件没加载（查挂载）；
#   404 body=not found=请求形状错（GET/路径错）
# · 验证前置：至少一台设备已 onboard（0 设备时 delivered 照打但没人收）
# · 真告警难造时的降级配方：按 examples 的 payload 形状 curl 一条（要自己算 HMAC——
#   echo -n '<body>' | openssl dgst -sha256 -hmac "<secret>" 取 hex 填 X-Grafana-Alerting-Signature）
#
# ── 旧版 Grafana（<11.1，HMAC Signature 选项还不存在，PR #100960 于 11.1/11.2 加入）──
# 一个文件只能有一个 verify 块；老版本请整块替换为（Authorization header 自 Grafana 9.1 就有）：
#   verify:
#     type: static-token
#     header: Authorization
#   并设 HOOKS_GRAFANA_SECRET="Bearer <token>"——注意必须是完整 header 值：static-token 做的是
#   header 值与密钥的常数时间相等比较，而 Grafana 固定按 "Scheme Credentials" 格式发
#   （config.go：headers["Authorization"] = fmt.Sprintf("%s %s", scheme, credentials)，
#   credentials 非空且 scheme 留空时默认 Bearer）。Grafana 12+ 也可改用 Extra Headers
#   塞 X-Hotify-Token: <token>，则 header 换成 X-Hotify-Token、密钥就是裸 token。

id: grafana                   # URL 段 POST /hooks/grafana；secret 变量名 HOOKS_GRAFANA_SECRET 由它推导（hooks.md §3.5）
apiVersion: hooks/v1

# 验签：Grafana HMAC 签名（http/hmac.go）——HMAC-SHA256、密钥=secret 原始字节、
# 签名原文=裸 body（timestamp header 未设时）、hex 编码、签名值无前缀、
# 签名头默认 X-Grafana-Alerting-Signature。与 hooks.md §3.2 hmac 族逐项吻合：
# algo sha256 / encoding hex / prefix 缺省("") / 原文=原始 body 字节。
verify:
  type: hmac
  header: X-Grafana-Alerting-Signature
  algo: sha256
  encoding: hex

# 事件筛选：Grafana webhook 只发一种事件（告警通知），payload 无事件类型字段可筛
# → 不写 filter，firing 与 resolved 都推（title 自带 [FIRING:n] / [RESOLVED] 区分）。
# 若只要触发不要恢复，取消下面注释（代价：resolved 通知被静默丢弃，fileOnly log 可查）：
# filter:
#   equals:
#     $.status: firing

# 通知内容：只取顶层标量——4 个引用全部是发送侧结构体无条件序列化的字段
# （webhookMessage/ExtendedData 无 omitempty），真实请求不存在缺字段形态，零提取失败面。
#   title = Grafana 默认模板的预渲染摘要：[状态:触发数] 分组标签值 (公共标签值)
#           ——恰好覆盖场景要的 告警名+状态+关键标签（单告警时 alertname 必在公共标签里）；
#   body  = 同为预渲染串：逐告警 Value / Labels / Annotations / Source / Silence 全量；
#   url   = externalURL（Grafana 根地址）。最有用的深链 generatorURL/silenceURL 在
#           alerts[] 数组里，hooks/v1 点路径无下标无循环（hooks.md §4.1），取不到。
# ⚠️ 别在此引用 $.commonLabels.<具体键>（如 severity）：标签键由部署者的告警规则自定义，
# 缺键 = 提取失败 = 整条通知静默丢（hooks.md §4.3，一个占位符烂全条作废）。想加哪个标签，
# 往 Grafana 的 Title/Message 模板里加（源端模板语言支持迭代），别在本文件里赌键名。
mapping:
  title: "{{$.title}}"
  body: "{{$.message}}"
  url: "{{$.externalURL}}"
  priority: "5"               # 告警场景取最高档落 Ext["priority"]；单 filter 单 mapping 无法按
                              # firing/resolved 分档（hooks.md §9），resolved 同为 5

# 投递目标："" = 广播全部设备（hooks.md §10 默认）；要只推一台可改自己的 slug 或 uuid。
device: ""

# 样例（捕获型源——Grafana wire 格式固定；hooks.md §5 铁律：每个取值可溯源）：
#   字段值取自官方文档 "Default JSON payload" 示例（play.grafana.org 双告警样本，逐字）；
#   title/message 文本由 templates/default_template.go 默认模板（default.title=__subject、
#   default.message=__text_alert_list）套该样本逐字推导——含数组 join " "、SortedPairs 按键排序、
#   float64 以 %v 输出（44.23943737541908、1）等渲染细节。
# 无负样本，理由：无 filter → 无 filter-miss 宇宙；mapping 引用的 4 字段均为结构体保证字段，
# 不存在诚实的"提取失败"payload 形态，编造负样本违反 §5 溯源铁律（§10 中负样本本就可选）。
# resolved-单告警 条目为推导变体：同一告警改 status/endsAt/state，commonLabels/commonAnnotations
# 取单告警全集（交集=自身），title 按模板 resolved 分支无计数；endsAt 具体时刻为构造值。
examples:
  - name: firing-two-alerts
    body:
      receiver: My Super Webhook
      status: firing
      orgId: 1
      alerts:
        - status: firing
          labels: { alertname: High memory usage, team: blue, zone: us-1 }
          annotations:
            description: The system has high memory usage
            runbook_url: https://myrunbook.com/runbook/1234
            summary: This alert was triggered for zone us-1
          startsAt: "2021-10-12T09:51:03.157076+02:00"
          endsAt: "0001-01-01T00:00:00Z"
          generatorURL: https://play.grafana.org/alerting/1afz29v7z/edit
          fingerprint: c6eadffa33fcdf37
          silenceURL: "https://play.grafana.org/alerting/silence/new?alertmanager=grafana&matchers=alertname%3DT2%2Cteam%3Dblue%2Czone%3Dus-1"
          dashboardURL: ""
          panelURL: ""
          values: { B: 44.23943737541908, C: 1 }
        - status: firing
          labels: { alertname: High CPU usage, team: blue, zone: eu-1 }
          annotations:
            description: The system has high CPU usage
            runbook_url: https://myrunbook.com/runbook/1234
            summary: This alert was triggered for zone eu-1
          startsAt: "2021-10-12T09:56:03.157076+02:00"
          endsAt: "0001-01-01T00:00:00Z"
          generatorURL: https://play.grafana.org/alerting/d1rdpdv7k/edit
          fingerprint: bc97ff14869b13e3
          silenceURL: "https://play.grafana.org/alerting/silence/new?alertmanager=grafana&matchers=alertname%3DT1%2Cteam%3Dblue%2Czone%3Deu-1"
          dashboardURL: ""
          panelURL: ""
          values: { B: 44.23943737541908, C: 1 }
      groupLabels: {}
      commonLabels: { team: blue }
      commonAnnotations: {}
      externalURL: https://play.grafana.org/
      version: "1"
      groupKey: "{}:{}"
      truncatedAlerts: 0
      state: alerting
      title: "[FIRING:2]  (blue)"
      message: "**Firing**\n\nValue: B=44.23943737541908, C=1\nLabels:\n - alertname = High memory usage\n - team = blue\n - zone = us-1\nAnnotations:\n - description = The system has high memory usage\n - runbook_url = https://myrunbook.com/runbook/1234\n - summary = This alert was triggered for zone us-1\nSource: https://play.grafana.org/alerting/1afz29v7z/edit\nSilence: https://play.grafana.org/alerting/silence/new?alertmanager=grafana&matchers=alertname%3DT2%2Cteam%3Dblue%2Czone%3Dus-1\n\nValue: B=44.23943737541908, C=1\nLabels:\n - alertname = High CPU usage\n - team = blue\n - zone = eu-1\nAnnotations:\n - description = The system has high CPU usage\n - runbook_url = https://myrunbook.com/runbook/1234\n - summary = This alert was triggered for zone eu-1\nSource: https://play.grafana.org/alerting/d1rdpdv7k/edit\nSilence: https://play.grafana.org/alerting/silence/new?alertmanager=grafana&matchers=alertname%3DT1%2Cteam%3Dblue%2Czone%3Deu-1\n"
    expect:
      pass: true
      title: "[FIRING:2]  (blue)"
      body: "**Firing**\n\nValue: B=44.23943737541908, C=1\nLabels:\n - alertname = High memory usage\n - team = blue\n - zone = us-1\nAnnotations:\n - description = The system has high memory usage\n - runbook_url = https://myrunbook.com/runbook/1234\n - summary = This alert was triggered for zone us-1\nSource: https://play.grafana.org/alerting/1afz29v7z/edit\nSilence: https://play.grafana.org/alerting/silence/new?alertmanager=grafana&matchers=alertname%3DT2%2Cteam%3Dblue%2Czone%3Dus-1\n\nValue: B=44.23943737541908, C=1\nLabels:\n - alertname = High CPU usage\n - team = blue\n - zone = eu-1\nAnnotations:\n - description = The system has high CPU usage\n - runbook_url = https://myrunbook.com/runbook/1234\n - summary = This alert was triggered for zone eu-1\nSource: https://play.grafana.org/alerting/d1rdpdv7k/edit\nSilence: https://play.grafana.org/alerting/silence/new?alertmanager=grafana&matchers=alertname%3DT1%2Cteam%3Dblue%2Czone%3Deu-1\n"
  - name: resolved-single-alert
    body:
      receiver: My Super Webhook
      status: resolved
      orgId: 1
      alerts:
        - status: resolved
          labels: { alertname: High memory usage, team: blue, zone: us-1 }
          annotations:
            description: The system has high memory usage
            runbook_url: https://myrunbook.com/runbook/1234
            summary: This alert was triggered for zone us-1
          startsAt: "2021-10-12T09:51:03.157076+02:00"
          endsAt: "2021-10-12T10:01:03.157076+02:00"
          generatorURL: https://play.grafana.org/alerting/1afz29v7z/edit
          fingerprint: c6eadffa33fcdf37
          silenceURL: "https://play.grafana.org/alerting/silence/new?alertmanager=grafana&matchers=alertname%3DT2%2Cteam%3Dblue%2Czone%3Dus-1"
          dashboardURL: ""
          panelURL: ""
          values: { B: 44.23943737541908, C: 1 }
      groupLabels: {}
      commonLabels: { alertname: High memory usage, team: blue, zone: us-1 }
      commonAnnotations:
        description: The system has high memory usage
        runbook_url: https://myrunbook.com/runbook/1234
        summary: This alert was triggered for zone us-1
      externalURL: https://play.grafana.org/
      version: "1"
      groupKey: "{}:{}"
      truncatedAlerts: 0
      state: ok
      title: "[RESOLVED]  (High memory usage blue us-1)"
      message: "**Resolved**\n\nValue: B=44.23943737541908, C=1\nLabels:\n - alertname = High memory usage\n - team = blue\n - zone = us-1\nAnnotations:\n - description = The system has high memory usage\n - runbook_url = https://myrunbook.com/runbook/1234\n - summary = This alert was triggered for zone us-1\nSource: https://play.grafana.org/alerting/1afz29v7z/edit\nSilence: https://play.grafana.org/alerting/silence/new?alertmanager=grafana&matchers=alertname%3DT2%2Cteam%3Dblue%2Czone%3Dus-1\n"
    expect:
      pass: true
      title: "[RESOLVED]  (High memory usage blue us-1)"
      body: "**Resolved**\n\nValue: B=44.23943737541908, C=1\nLabels:\n - alertname = High memory usage\n - team = blue\n - zone = us-1\nAnnotations:\n - description = The system has high memory usage\n - runbook_url = https://myrunbook.com/runbook/1234\n - summary = This alert was triggered for zone us-1\nSource: https://play.grafana.org/alerting/1afz29v7z/edit\nSilence: https://play.grafana.org/alerting/silence/new?alertmanager=grafana&matchers=alertname%3DT2%2Cteam%3Dblue%2Czone%3Dus-1\n"
