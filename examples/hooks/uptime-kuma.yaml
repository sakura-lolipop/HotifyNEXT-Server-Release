# Hotify 插件：Uptime Kuma 掉线/恢复通知（源 = github.com/louislam/uptime-kuma，master@2026-08-28 查证）。
# 行为基线 = 发送侧源码：
#   server/notification-providers/webhook.js —— POST + "json" 预设下 body 恒为
#     { "heartbeat": <心跳对象|null>, "monitor": <监控对象|null>, "msg": <字符串> }；
#     Kuma 不做任何签名，但支持 webhookAdditionalHeaders（任意自定义 header）。
#   server/model/monitor.js —— 仅状态变化拍发通知（首拍 DOWN / *→DOWN / DOWN→UP，维护进出不通知）；
#     msg = "[监控名] [✅ Up|🔴 Down] <心跳消息>"，顶层字符串自带全部语义；
#     证书到期通知与「测试」按钮调用时 heartbeat/monitor 均为 null、只剩 msg。
# 安装（两侧都要配）：
#   1) Hotify：本文件放工作目录 hooks/ + 设 HOOKS_UPTIME_KUMA_SECRET（compose environment: 块——
#      GUI 部署不吃 .env，hooks.md §3.5）+ 重启 server。
#   2) Uptime Kuma → 设置 → 通知 → 新建 Webhook：
#        Post URL:           https://<Hotify 域名>/hooks/uptime-kuma
#        HTTP Method:        POST        （GET 无 body，引擎收不到 JSON）
#        Request Body:       application/json 预设（勿选 form-data——multipart 非 JSON，静默丢；
#                            custom 模板型 body 也不适配本插件的固定 mapping）
#        Additional Headers: {"X-Hotify-Token": "<与 HOOKS_UPTIME_KUMA_SECRET 完全相同的值>"}
#                            （整值全等比较——不要加 "Bearer " 前缀，除非把前缀算进 secret 本体）
#   3) 端到端验证（hooks.md §10 步骤5）＝点 Kuma 的「测试」按钮：手机应收到
#      body 为 "<该通知的名字> Testing" 的推送；测试按钮变红 = header 值与 secret 不等（401）。
# 已知边界（hooks/v1 表达力，§8/§9）：
#   - 掉线(🔴)/恢复(✅) 语义已由源端拼进 msg（含 emoji），本模板无需条件文案；但"掉线高优先级/
#     恢复低优先级"这类按事件取值不可表达（单 filter 单 mapping），故不设 priority。
#   - mapping.url 刻意引用 $.monitor.url 作**装饰降级语义的正面示范**（hooks.md §4.3）：
#     它仅 http(s) 型监控有值、push/port 型为 null——url 是装饰字段，提取失败=省略照发，
#     nullable 源字段从 v1 分级语义起可安全引用。

id: uptime-kuma               # URL 段 POST /hooks/uptime-kuma；secret 变量名 HOOKS_UPTIME_KUMA_SECRET 由它推导（§3.5）
apiVersion: hooks/v1

# 验签：Kuma 自身零签名（webhook.js 无任何签名逻辑）→ 裸形态属 §3.4 none 族；
# 但源端支持任意自定义 header（webhookAdditionalHeaders），按 §3.4 指引
# "源端支持自定义 header 时塞个 token 走 §3.3 永远更优" → 选 static-token。
# header 名避开 Authorization（防中间层/反代剥改），自定义名最稳。
verify:
  type: static-token
  header: X-Hotify-Token

# 事件筛选：不写。掉线与恢复共享此门（$.heartbeat.status 0|1 是 OR 关系，equals 只有 AND 表达不了）；
# 源端 isImportantForNotification 已保证只发状态变化拍（UP→DOWN / DOWN→UP / 首拍DOWN / 维护→DOWN、
# DOWN 期间按 resendInterval 重发），无过滤 ≠ 噪音。PENDING→UP 与维护进出源端本来就不通知。
filter: {}                    # 空 equals ≡ 不写（§4.2），显式写出以示权衡过

# 通知内容：顶层 msg 在全部触发路径（掉线/恢复/重发/证书到期/测试）下恒为非空字符串
# （monitor.js sendNotification 拼装 / 测试按钮 "<name> Testing"），故仅引用它即可全路径渲染。
# 标题固定——$.monitor.name 在测试/证书通知里是 null，引用它会让这两类静默提取失败。
mapping:
  title: "Uptime Kuma"
  body: "{{$.msg}}"
  url: "{{$.monitor.url}}"    # 装饰字段（§4.3）：http 型=跳监控页；push/port 型 monitor.url=null → 省略照发

# 投递目标："" = 广播全部设备（hooks.md §10 默认）。监控告警语义上通常希望"任何一台在线设备都能看到"；
# 部署者可改成自己的 slug/uuid 定向单台。禁止 key1。
device: ""

# 样例（hooks.md §5 捕获型：POST + json 预设下 wire 由 Kuma 源码钉死）——形状逐字段推导自：
#   webhook.js data 构造 + monitor.js sendNotification（msg 拼装 / heartbeat 补 timezone·
#   timezoneOffset·localDateTime·lastDownTime）+ heartbeat.js toJSONAsync（monitorID/status/time/
#   msg/ping/important/duration/retries/response）+ monitor.js toJSON（monitor 对象）。
#   monitor.toJSON 实际含数十字段，此处仅列与真实 http 型监控一致的代表性子集，
#   其余略去（同 memos 样板先例：未参与渲染的字段不逐个钉值，列入只添编造风险）。
#   time 为 redbean isoDateTimeMillis 的 UTC 字符串（bean.time = R.isoDateTimeMillis(dayjs.utc())）；
#   ping/duration/retries 具体取值按监控类型与间隔而异，例中取 http 型典型值。
#   emoji ✅/🔴 出自 monitor.js 写死的 text 常量，expect 逐字比对含 emoji。
examples:
  - name: monitor-down
    body:
      heartbeat:
        monitorID: 3
        status: 0                               # DOWN（heartbeat.js：0=DOWN 1=UP 2=PENDING 3=MAINTENANCE）
        time: "2026-08-28 04:34:56.789"         # UTC；localDateTime 是它 tz 后的镜像
        msg: "getaddrinfo ENOTFOUND example.com"
        ping: null                              # http 型失败拍通常无 ping
        important: true                         # 状态变化拍
        duration: 60                            # 距上一拍秒数（interval=60）
        retries: 0
        response: null                          # storeResponse 关闭时
        timezone: Asia/Shanghai
        timezoneOffset: "+08:00"                # dayjs().format("Z")
        localDateTime: "2026-08-28 12:34:56"    # dayjs.utc(time).tz(tz).format("YYYY-MM-DD HH:mm:ss")
      monitor:
        id: 3
        name: Example Website
        url: https://example.com
        type: http
        method: GET
        interval: 60
        maxretries: 3
        retryInterval: 60
        resendInterval: 0
        active: true
        ignoreTls: false
        upsideDown: false
      msg: "[Example Website] [🔴 Down] getaddrinfo ENOTFOUND example.com"
    expect:
      pass: true
      title: "Uptime Kuma"
      body: "[Example Website] [🔴 Down] getaddrinfo ENOTFOUND example.com"
  - name: monitor-recovered
    body:
      heartbeat:
        monitorID: 3
        status: 1                               # UP——仅 DOWN→UP 恢复拍才触发通知
        time: "2026-08-28 05:12:56.789"
        msg: "200 - OK"
        ping: 187
        important: true
        duration: 60
        retries: 0
        response: null
        timezone: Asia/Shanghai
        timezoneOffset: "+08:00"
        localDateTime: "2026-08-28 13:12:56"
        lastDownTime: "2026-08-28 04:34:56.789" # 恢复拍附加：最近一次 important DOWN 拍的时刻
      monitor:
        id: 3
        name: Example Website
        url: https://example.com
        type: http
        method: GET
        interval: 60
        maxretries: 3
        retryInterval: 60
        resendInterval: 0
        active: true
        ignoreTls: false
        upsideDown: false
      msg: "[Example Website] [✅ Up] 200 - OK"
    expect:
      pass: true
      title: "Uptime Kuma"
      body: "[Example Website] [✅ Up] 200 - OK"
  - name: test-button
    body:
      heartbeat: null                           # 测试按钮调用 Notification.send(config, name + " Testing")
      monitor: null                             # → heartbeat/monitor 均 null，只剩 msg
      msg: "Hotify Testing"
    expect:
      pass: true
      title: "Uptime Kuma"
      body: "Hotify Testing"
  - name: certificate-expiry
    body:
      heartbeat: null                           # 证书到期通知同形（monitor.js sendCertNotificationByTargetDays）
      monitor: null
      msg: "[Example Website][https://example.com] https certificate example.com will expire in 7 days"
    expect:
      pass: true
      title: "Uptime Kuma"
      body: "[Example Website][https://example.com] https certificate example.com will expire in 7 days"
