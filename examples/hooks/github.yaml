# Hotify 插件：GitHub repository webhook「push」事件通知（谁推了 / 哪个仓 / 推了什么）。
# 行为基线 = GitHub 官方文档（webhooks 发送侧）：
#   - 验签：docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
#   - push 事件字段表：docs.github.com/en/webhooks/webhook-events-and-payloads#push
#     （当前版官方文档已不附 per-event 样例 payload；完整官方样例取自仍在线的 Enterprise Server 3.5
#      归档页 docs.github.com/en/enterprise-server@3.5/developers/webhooks-and-events/webhooks/
#      webhook-events-and-payloads#push，字段集与 github.com 一致，仅多 enterprise 字段）
# 安装（部署契约，缺一不可）：
#   1. 本文件放入工作目录 hooks/ 下；
#   2. 设环境变量 HOOKS_GITHUB_PUSH_SECRET = GitHub webhook 里配置的 Secret 原样字符串（hooks.md §3.5）；
#   3. 重启 server，启动自检绿 = 装好。
#   GitHub 侧（仓库 Settings → Webhooks → Add webhook）：
#   - Payload URL: https://<你的域名>/hooks/github-push
#   - Content type: 必须选 application/json。选 form-urlencoded 时 body 是 payload= 表单参数而非
#     JSON，引擎按 JSON parse 必失败——永不通知、只剩 stdout 日志（hooks/v1 无 form 解包能力）。
#   - Secret: 与 HOOKS_GITHUB_PUSH_SECRET 相同的串（GitHub 允许任意文本串，无前缀）。
#   - 事件：Let me select individual events → 只勾 push。GitHub 用 X-GitHub-Event header 区分事件，
#     payload body 里没有常量判别字段，hooks/v1 的 filter 只能看 JSON body（hooks.md §4.1），
#     「只留 push」表达不了，必须靠源端订阅配置兜住（见下方 filter 注释的二次防线）。
#   - webhook 建好时 GitHub 必发一条 ping：本插件不产通知（负样本 ping-at-setup 固化该行为）。
# 已知取舍（hooks/v1 表达力天花板，hooks.md §4.1/§8，刻意封顶非缺陷）：
#   - 场景要的「几条 commit」不可表达：commits 是对象数组，白名单无下标、无循环、无 length，
#     「数组 join ", "」只对 string/number/bool 元素有定义。本插件用 head_commit.message
#     （本次 push 顶端 commit 的主题）作最近似信号。要真正的条数/commit 列表 → §8 写 Go 皮
#     （照 ntfy.go 的壳加一个 registerXxxRoutes）。
#   - 无前缀/子串匹配：ref 是全量形态（refs/heads/main、refs/tags/v1.0），filter 只有 equals，
#     tag push 无法与 branch push 分开，一律通知（GitHub 的 push 事件本身即含 branch+tag，
#     官方样例就是一个 tag push）。
#   - 删分支 push（deleted:true，head_commit 为 null）→ body 占位符提取失败 → 静默不通知。
#     删分支不携带代码，符合「push 代码」场景（负样本 branch-deleted-silent 固化）。

id: github-push               # URL 段 POST /hooks/github-push；secret 变量名 HOOKS_GITHUB_PUSH_SECRET 由它推导
apiVersion: hooks/v1

# GitHub 签名 = HMAC-SHA256(原始 body 字节, secret) 的 hex 小写摘要，放 X-Hub-Signature-256，
# 值恒带 "sha256=" 前缀；另有 legacy X-Hub-Signature（sha1）不用 → §3.2 hmac 族四参全部对上。
verify:
  type: hmac
  header: X-Hub-Signature-256
  algo: sha256
  encoding: hex
  prefix: "sha256="

# 刻意不写 filter：事件判别字段（X-GitHub-Event）在 header，payload body 里没有常量字段可 equals。
# 过滤交给源端订阅配置（见文件头部署契约）；即便配错来了别的事件，mapping 引用的
# $.pusher.name / $.head_commit.message 仅 push 事件携带 → 提取失败 → 200 + stdout 留痕、不产通知
# （负样本 ping-at-setup 即此防线的回归测试）。

mapping:
  title: "[GitHub] {{$.pusher.name}} → {{$.repository.full_name}}"
  body: "{{$.ref}} · {{$.head_commit.message}}"
  url: "{{$.compare}}"       # before...after 变更对比页（push 事件必带）

device: ""                    # 广播全部设备；要单台改成设备 slug 或 uuid（禁止 key1，hooks.md §2）

examples:
  # 正样本 1：官方样例 payload 原值裁剪（未引用字段不列入——自检不碰它们，hooks.md §5 ⚠️；
  # 官方样例还含 repository 数十个字段、sender、enterprise 等未引用/ES 特有字段）。
  # 注意它是 tag push：零条 commit 但 head_commit 指向被推的 commit → 仍产通知（by design）。
  - name: push-tag-official-sample
    body:
      ref: refs/tags/simple-tag
      before: "0000000000000000000000000000000000000000"
      after: "6113728f27ae82c7b1a177c8d03f9e96e0adf246"
      created: true
      deleted: false
      forced: false
      base_ref: null
      compare: https://octocoders.github.io/Codertocat/Hello-World/compare/simple-tag
      commits: []
      head_commit:
        id: "6113728f27ae82c7b1a177c8d03f9e96e0adf246"
        message: Adding a .gitignore file
      repository:
        id: 118
        name: Hello-World
        full_name: Codertocat/Hello-World
      pusher:
        name: Codertocat
        email: Codertocat@Octocoders.io
    expect:
      pass: true
      title: "[GitHub] Codertocat → Codertocat/Hello-World"
      body: "refs/tags/simple-tag · Adding a .gitignore file"
  # 正样本 2：普通 branch push（commits 非空）——最常见形态。非整体捕获：字段值逐个取自官方
  # 样例与字段表示例（ref 示例值 refs/heads/main、commit/head_commit 形状照官方样例、
  # compare 用文档 schema 描述的 {base}...{head} 模板形态）拼装，值级未捕获。
  - name: push-branch-assembled
    body:
      ref: refs/heads/main
      before: "0000000000000000000000000000000000000000"
      after: "6113728f27ae82c7b1a177c8d03f9e96e0adf246"
      created: true
      deleted: false
      forced: false
      base_ref: null
      compare: https://github.com/Codertocat/Hello-World/compare/0000000000000000000000000000000000000000...6113728f27ae82c7b1a177c8d03f9e96e0adf246
      commits:
        - id: "6113728f27ae82c7b1a177c8d03f9e96e0adf246"
          message: Adding a .gitignore file
      head_commit:
        id: "6113728f27ae82c7b1a177c8d03f9e96e0adf246"
        message: Adding a .gitignore file
      repository:
        id: 118
        name: Hello-World
        full_name: Codertocat/Hello-World
      pusher:
        name: Codertocat
        email: Codertocat@Octocoders.io
    expect:
      pass: true
      title: "[GitHub] Codertocat → Codertocat/Hello-World"
      body: "refs/heads/main · Adding a .gitignore file"
  # 负样本 1：webhook 建好必到的 ping（zen/hook_id/hook/repository/sender，无 pusher、无
  # head_commit）→ $.pusher.name 缺失 = 提取失败型负样本（无 filter 插件的标准负形态，hooks.md §5）。
  - name: ping-at-setup
    body:
      zen: Non-blocking is better than blocking.
      hook_id: 30
      hook: { type: Repository, id: 30, name: web }
    expect:
      pass: false
  # 负样本 2：删分支 push —— head_commit 为 null（当前版字段表类型 "object or null"；ref 被删时
  # after 无 commit 可指）→ $.head_commit.message 提取失败，不产通知。形状按字段表+删除语义推导，
  # 值级未捕获（before 沿用官方样例 after 值）。
  - name: branch-deleted-silent
    body:
      ref: refs/heads/feature-x
      before: "6113728f27ae82c7b1a177c8d03f9e96e0adf246"
      after: "0000000000000000000000000000000000000000"
      created: false
      deleted: true
      forced: false
      commits: []
      head_commit: null
      repository: { id: 118, name: Hello-World, full_name: Codertocat/Hello-World }
      pusher: { name: Codertocat, email: Codertocat@Octocoders.io }
    expect:
      pass: false
