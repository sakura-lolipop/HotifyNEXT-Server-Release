version: "3.8"

services:
  hotify-server:
    image: crpi-gi2hyqoir87c0lus.cn-hangzhou.personal.cr.aliyuncs.com/sakura-lolipop/hotify-server:v1.2
    container_name: hotify-server
    restart: unless-stopped
    ports:
      # TRIM_SERVICE_PORT=fnOS 系统变量（manifest service_port 的运行态；wg-easy/155-app 生态共识写法）。
      # 引号保留：cmd/service-setup 的 apply_port sed 按带引号 "…:8443" 模式改写（config 流改端口）。
      - "${TRIM_SERVICE_PORT}:8443"
    environment:
      # ${wizard_*} 向导值经 compose 替换注入容器（wg-easy 实证此链路通）；:-默认值兜底向导没跑场景
      TZ: ${wizard_tz:-Asia/Shanghai}
      EXTERNAL_URL: ${wizard_external_url:-}
      TRUSTED_PROXIES: ${wizard_trusted_proxies:-}
      MAX_BYTES: ${wizard_max_bytes:-16384}
      MAX_UPLOAD: ${wizard_max_upload:-4GiB}
      # 高级项不进向导（证书直配 HTTPS / 自建票端点 CLOUD_FUNCTION_TOKEN 等）：见 fpk/README，
      # 手动编辑本文件后应用中心重启。公共部署零配置——票端点匿名开放，离线推送开箱即用
    volumes:
      - hotify-data:/data

volumes:
  hotify-data:
