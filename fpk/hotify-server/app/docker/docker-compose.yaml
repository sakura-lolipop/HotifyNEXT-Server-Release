version: "3.8"

services:
  hotify-server:
    image: crpi-gi2hyqoir87c0lus.cn-hangzhou.personal.cr.aliyuncs.com/sakura-lolipop/hotify-server:v1.1
    container_name: hotify-server
    restart: unless-stopped
    ports:
      # wizard_port=安装向导收集的端口（wizard/install 字段同名环境变量）；:-8443 兜底 wizard 缺失场景
      - "${wizard_port:-8443}:8443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - hotify-data:/data

volumes:
  hotify-data:
