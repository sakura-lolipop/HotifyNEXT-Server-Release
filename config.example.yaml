# config.example.yaml — Hotify Server 配置模板
#
# 用法：复制改名为 config.yaml 再改值（binary 路线；Docker 路线走 environment: 块即可，无需本文件）。
# YAML 宽松格式：每行 `键: 值`，# 是注释，列表直接用多行 ` - 值`（无需 []/引号/逗号）。
# ⚠️ 路径含反斜杠（Windows 绝对路径）须用单引号或正斜杠：path: 'C:\Users\...' 或 path: C:/Users/...。
# 环境变量也能覆盖下面字段（直接用字段名的大写形式，如 HTTPS_PORT / CERT_FILE / CLOUD_FUNCTION_TOKEN），env 优先。
# 例外：store.path / store.type 不走 env（变量名会与系统变量冲突 PATH/TYPE），只走本文件或默认值。

server:
  https_port: 8443          # 主端口；配 tls cert 即 HTTPS，未配置则为 HTTP
  http_port: 8080           # 仅作 http→https 307 跳转入口（配置证书且 force_https: true 才监听；未配置证书时本端口不启用）
  force_https: true         # true=开 http_port 强制跳转（仅配 cert 时生效）
  # tls:                    # 想开 HTTPS：取消注释 + 填 cert/key
  #   cert_file: /path/to/fullchain.pem
  #   key_file:  /path/to/privkey.pem
  trusted_proxies:          # 可选；解析 X-Forwarded-For 的可信反代网段。缺省=仅 loopback
    - "127.0.0.0/8"
    - "::1"
  # external_url：server 对外可达地址（含 scheme）。反代/隧道后必配。
  #   - 配了 → 第三方客户端（bark/gotify 形态）通知显示媒体图、附件可点击
  #   - 不配置 → 关闭上述第三方客户端的媒体地址改写（原生 Hotify 客户端不受影响）
  # external_url: "https://your-domain.example:8443"
  # max_upload: "8GiB"      # 单次上传上限（含 meta+全部文件；默认 4GiB；整数值单位为 MB）

pushkit:
  # cloud_function_urls 留空（默认）= 自动拉取推送入口 URL + 每小时刷新，无需手填。
  # cloud_function_urls:
  #   - "https://your-cloud-function.example/api/push"
  # cloud_function_token 默认已内置公共推送云函数的口令（离线推送开箱即用）；仅自建云函数时覆盖：
  # cloud_function_token: "your-own-token"
  subscribe_label: "true"           # "true" 给订阅类推送标题加前缀（华为类目要求）

store:
  type: "bbolt"           # bbolt（持久，默认）| memory（调试用，重启后数据丢失）
  path: "hotify.db"       # 数据库文件（相对路径=工作目录）
  blob_dir: "./blobs/"    # 媒体文件目录（文件系统，不进数据库）
  max_bytes: 16384        # 存储空间上限（默认单位 MB，也接受 "16GiB" 写法）；16384=16GiB
